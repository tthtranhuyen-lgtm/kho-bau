<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏴‍☠️ Truy Tìm Kho Báu Tiếng Trung 🏴‍☠️</title>
    
    <!-- Thư viện tạo hiệu ứng pháo hoa -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=ZCOOL+KuaiLe&family=Noto+Sans+SC:wght@500&display=swap');

        :root {
            --cell-bg: #fff8e7;
            --highlight: #ffb347;
            --found-bg: #2ed573;
            --found-text: #ffffff;
            --map-bg: #f4d690;
            --map-border: #3e2723;
        }

        * {
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #a8e6cf;
            background-image: radial-gradient(#ffffff 15%, transparent 16%), radial-gradient(#ffffff 15%, transparent 16%);
            background-size: 40px 40px;
            background-position: 0 0, 20px 20px;
            overflow: hidden;
        }

        header {
            text-align: center;
            padding: 10px 10px 15px 10px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(5px);
            border-bottom: 4px dashed #ff8a5c;
            z-index: 10;
            flex-shrink: 0;
        }

        h1 {
            font-family: 'ZCOOL KuaiLe', cursive;
            margin: 0;
            color: #ff4757;
            font-size: 26px;
            text-shadow: 2px 2px 0px #fff;
        }

        .subtitle {
            color: #2f3542;
            font-size: 13px;
            font-weight: bold;
            margin-top: 5px;
            background: #fff;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .game-container {
            display: flex;
            flex: 1;
            padding: 10px 15px;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
            overflow: hidden;
        }

        /* ================= BẢN ĐỒ KHO BÁU ================= */
        .map-wrapper {
            flex: 0 0 380px;
            height: 100%;
            position: relative;
            filter: drop-shadow(5px 10px 15px rgba(0,0,0,0.3));
            display: flex;
            flex-direction: column;
        }

        .map-panel {
            width: 100%;
            height: 100%;
            background-color: var(--map-bg);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(139, 69, 19, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(139, 69, 19, 0.08) 0%, transparent 40%);
            
            clip-path: polygon(
                2% 3%, 8% 0%, 15% 2%, 25% 0%, 35% 3%, 45% 1%, 55% 4%, 65% 0%, 75% 3%, 85% 0%, 95% 2%, 98% 8%, 
                100% 15%, 97% 25%, 100% 35%, 98% 45%, 100% 55%, 97% 65%, 100% 75%, 98% 85%, 100% 95%, 
                95% 98%, 85% 100%, 75% 97%, 65% 100%, 55% 98%, 45% 100%, 35% 97%, 25% 100%, 15% 98%, 5% 100%, 
                0% 95%, 2% 85%, 0% 75%, 3% 65%, 0% 55%, 2% 45%, 0% 35%, 3% 25%, 0% 15%, 2% 8%
            );
            
            border: 6px solid var(--map-border);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        .map-icon {
            position: absolute;
            font-size: 30px;
            opacity: 0.6;
            pointer-events: none;
        }
        .icon-ship { top: 5%; left: 10%; font-size: 35px; transform: rotate(-10deg); }
        .icon-compass { top: 5%; right: 10%; font-size: 40px; }
        .icon-mountain { bottom: 15%; left: 5%; font-size: 45px; }
        .icon-trees { bottom: 10%; right: 15%; font-size: 35px; }
        .icon-treasure { bottom: 2%; left: 45%; font-size: 40px; animation: float 2s infinite ease-in-out;}

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .clue-card {
            background: #fdf5e6;
            border: 4px solid #8b5a2b;
            border-radius: 16px;
            padding: 20px;
            width: 90%;
            text-align: center;
            box-shadow: 5px 5px 0px rgba(139, 69, 19, 0.4);
            position: relative;
            transition: all 0.3s ease;
            min-height: 180px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            z-index: 2;
        }

        .clue-card::before {
            content: "📌";
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 28px;
            filter: drop-shadow(0px 2px 2px rgba(0,0,0,0.3));
        }

        .clue-card.found {
            background: #e8f5e9;
            border-color: #2ed573;
        }

        .clue-card.found::after {
            content: "❌";
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(1.5);
            font-size: 80px;
            opacity: 0.8;
            z-index: 3;
        }

        .clue-chinese {
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 22px;
            font-weight: bold;
            color: #212121;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .clue-pinyin {
            font-weight: 700;
            color: #e53935;
            font-size: 15px;
            margin-bottom: 5px;
            line-height: 1.4;
        }

        .clue-meaning {
            font-size: 14px;
            color: #5d4037;
            font-style: italic;
        }

        .map-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 90%;
            margin-top: 20px;
            z-index: 10;
        }

        .nav-btn {
            background: #8b5a2b;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 15px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 3px 0 #4e342e;
            transition: all 0.1s;
        }
        .nav-btn:active { transform: translateY(3px); box-shadow: none; }
        .nav-btn:hover { background: #a06933; }

        .progress-text {
            font-family: 'ZCOOL KuaiLe', cursive;
            font-size: 20px;
            color: #4e342e;
            font-weight: bold;
        }

        .reset-btn {
            margin-top: 20px;
            padding: 8px 25px;
            font-family: 'Quicksand', sans-serif;
            font-weight: bold;
            font-size: 15px;
            color: #fff;
            background: #ff4757;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            box-shadow: 0 3px 0 #c0392b;
            transition: all 0.1s;
            z-index: 10;
        }
        .reset-btn:active { transform: translateY(3px); box-shadow: none; }
        .reset-btn:hover { background: #ff6b81; }

        /* ================= BẢNG MA TRẬN ================= */
        .grid-panel {
            flex: 1;
            height: 100%;
            background: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            padding: 15px;
            overflow: auto; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            border: 4px solid #fff;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(16, 1fr);
            gap: 3px;
            background: #dfe4ea;
            padding: 10px;
            border-radius: 16px;
            margin: 0 auto;
            width: fit-content;
        }

        .cell {
            width: 34px;
            height: 34px;
            background: var(--cell-bg);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans SC', sans-serif;
            font-size: 18px;
            font-weight: bold;
            color: #2f3542;
            cursor: pointer;
            border-radius: 6px;
            box-shadow: 0 2px 0px #ced6e0;
            transition: all 0.1s;
        }

        .cell:hover { background: #ffecd2; }

        .cell.selecting {
            background: var(--highlight);
            color: #fff;
            box-shadow: 0 0 10px var(--highlight);
            transform: scale(1.15);
            z-index: 2;
        }

        .cell.found {
            background: var(--found-bg);
            color: var(--found-text);
            box-shadow: 0 2px 0px #20bf6b;
            animation: pop 0.4s ease;
        }

        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.3) rotate(5deg); }
            100% { transform: scale(1) rotate(0); }
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
        }
        .shake-effect { animation: shake 0.4s ease; }

        #win-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .win-box {
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            border: 6px solid #ffb347;
            animation: bounceIn 0.6s;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .win-box h2 { color: #ff4757; font-size: 32px; margin-top: 0; }
        .win-box button {
            margin-top: 20px; padding: 12px 25px; font-size: 18px; font-weight: bold;
            background: #2ed573; color: white; border: none; border-radius: 30px; cursor: pointer;
        }
        .win-box button:active { transform: scale(0.95); }

        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.5); }
            100% { opacity: 1; transform: scale(1); }
        }

        @media (max-width: 900px) {
            .game-container {
                flex-direction: column;
                overflow-y: auto;
                height: auto;
            }
            .map-wrapper { flex: none; height: 380px; width: 100%; }
            .grid-panel { padding: 10px; }
            .cell { width: 28px; height: 28px; font-size: 15px; }
            body { overflow: auto; height: auto; }
        }
    </style>
</head>
<body>

    <header>
        <h1>🏴‍☠️ Truy Tìm Kho Báu 🏴‍☠️</h1>
        <div class="subtitle">Kéo chuột / vuốt, hoặc Bấm chữ đầu + Bấm chữ cuối để chọn!</div>
    </header>

    <div class="game-container">
        <div class="map-wrapper">
            <div class="map-panel">
                <div class="map-icon icon-ship">⛵</div>
                <div class="map-icon icon-compass">🧭</div>
                <div class="map-icon icon-mountain">⛰️</div>
                <div class="map-icon icon-trees">🌲🌲</div>
                <div class="map-icon icon-treasure">💰</div>

                <div class="clue-card" id="current-clue-card">
                    <div class="clue-chinese" id="c-hanzi"></div>
                    <div class="clue-pinyin" id="c-pinyin"></div>
                    <div class="clue-meaning" id="c-meaning"></div>
                </div>

                <div class="map-nav">
                    <button class="nav-btn" onclick="prevClue()">◀ Trước</button>
                    <div class="progress-text" id="progress-text">1 / 11</div>
                    <button class="nav-btn" onclick="nextClue()">Tiếp ▶</button>
                </div>

                <button class="reset-btn" onclick="resetGame()">🔄 Chơi Lại</button>
            </div>
        </div>

        <div class="grid-panel" id="grid-panel">
            <div class="grid" id="grid"></div>
        </div>
    </div>

    <div id="win-overlay">
        <div class="win-box">
            <h2>🎉 Tuyệt Vời! 🎉</h2>
            <p>Bạn đã tìm thấy toàn bộ kho báu!</p>
            <button onclick="resetGame()">Chơi Lại Nào</button>
        </div>
    </div>

    <script>
        // Ma trận 16x16 đã được xáo trộn ngang dọc, các chữ không còn xếp hàng dễ thấy
        const gridData = [
            "今爸妈树花水果你好书在吃喝买今妈".split(""),
            "天爸妈今天中午我在家吃午饭爸天妈".split(""),
            "早爸芒树花水果你好书在吃喝买晚妈".split(""),
            "上爸果树花水果你好书在吃喝买上妈".split(""),
            "我爸一树这些椅子都不是我家的我妈".split(""),
            "去爸公树花水果你好书在吃喝买给妈".split(""),
            "买家斤树花起果你好书在吃喝买女妈".split(""),
            "一回多树花床果你好书在吃喝买朋妈".split(""),
            "公我少树花以我家有四口人喝买友妈".split(""),
            "斤半钱树花后果你好书在吃喝买打妈".split(""),
            "苹八树花水我我喜欢吃香蕉喝买电妈".split(""),
            "果上树花水去果你好书在吃喝买话妈".split(""),
            "爸晚树花水刷我喜欢喝越南白咖啡妈".split(""),
            "妈天树花水牙果你好书在吃喝买卖妈".split(""),
            "树昨树花水这些桌子都是我家的卖妈".split(""),
            "花天树天水脸果你好书在吃喝买卖妈".split("")
        ];

        // Danh sách câu trả lời (Cập nhật lại tọa độ cho đúng với ma trận mới)
        const originalAnswers = [
            { id: 1, text: "今天早上我去买一公斤苹果", hanzi: "今天早上我去买一公斤苹果。", pinyin: "Jīntiān zǎoshang wǒ qù mǎi yī gōngjīn píngguǒ.", meaning: "Sáng nay tôi đi mua 1kg táo.", r1: 0, c1: 0, r2: 11, c2: 0 },
            { id: 2, text: "昨天晚上八点半我回家", hanzi: "昨天晚上八点半我回家。", pinyin: "Zuótiān wǎnshang bā diǎn bàn wǒ huí jiā.", meaning: "Tối qua 8h30 tôi về nhà.", r1: 15, c1: 1, r2: 6, c2: 1 }, // Đọc từ dưới lên
            { id: 3, text: "芒果一公斤多少钱", hanzi: "芒果一公斤多少钱？", pinyin: "Mángguǒ yī gōngjīn duōshao qián?", meaning: "Xoài 1kg bao nhiêu tiền?", r1: 2, c1: 2, r2: 9, c2: 2 },
            { id: 4, text: "这些桌子都是我家的", hanzi: "这些桌子都是我家的。", pinyin: "Zhèxiē zhuōzi dōu shì wǒ jiā de.", meaning: "Những cái bàn này đều là của nhà tôi.", r1: 14, c1: 5, r2: 14, c2: 13 },
            { id: 5, text: "今天晚上我给女朋友打电话", hanzi: "今天晚上我给女朋友打电话。", pinyin: "Jīntiān wǎnshang wǒ gěi nǚpéngyou dǎ diànhuà.", meaning: "Tối nay tôi gọi điện cho bạn gái.", r1: 0, c1: 14, r2: 11, c2: 14 },
            { id: 6, text: "今天中午我在家吃午饭", hanzi: "今天中午我在家吃午饭。", pinyin: "Jīntiān zhōngwǔ wǒ zài jiā chī wǔfàn.", meaning: "Trưa nay tôi ăn cơm ở nhà.", r1: 1, c1: 3, r2: 1, c2: 12 },
            { id: 7, text: "这些椅子都不是我家的", hanzi: "这些椅子都不是我家的。", pinyin: "Zhèxiē yǐzi dōu bù shì wǒ jiā de.", meaning: "Những cái ghế này đều không phải của nhà tôi.", r1: 4, c1: 4, r2: 4, c2: 13 },
            { id: 8, text: "起床以后我去刷牙洗脸", hanzi: "起床以后我去刷牙洗脸。", pinyin: "Qǐchuáng yǐhòu wǒ qù shuāyá xǐliǎn.", meaning: "Sau khi thức dậy tôi đi đánh răng rửa mặt.", r1: 6, c1: 5, r2: 15, c2: 5 },
            { id: 9, text: "我家有四口人", hanzi: "我家有四口人。", pinyin: "Wǒ jiā yǒu sì kǒu rén.", meaning: "Nhà tôi có 4 người.", r1: 8, c1: 6, r2: 8, c2: 11 },
            { id: 10, text: "我喜欢吃香蕉", hanzi: "我喜欢吃香蕉。", pinyin: "Wǒ xǐhuan chī xiāngjiāo.", meaning: "Tôi thích ăn chuối.", r1: 10, c1: 6, r2: 10, c2: 11 },
            { id: 11, text: "我喜欢喝越南白咖啡", hanzi: "我喜欢喝越南白咖啡。", pinyin: "Wǒ xǐhuan hē Yuènán bái kāfēi.", meaning: "Tôi thích uống cà phê trắng Việt Nam.", r1: 12, c1: 6, r2: 12, c2: 14 }
        ];

        let answers = []; 
        let foundAnswers = [];
        let currentClueIndex = 0;
        
        let isSelecting = false;
        let isDragging = false;
        let startR = -1, startC = -1;
        let currentSelection = [];

        const confettiSettings = { particleCount: 80, spread: 70, origin: { y: 0.6 }, colors: ['#ff4757', '#ffa502', '#2ed573', '#1e90ff', '#ff9ff3'] };

        function shuffleArray(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex != 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function init() {
            answers = shuffleArray([...originalAnswers]);
            renderSingleClue();
            renderGrid();
        }

        function renderSingleClue() {
            const clue = answers[currentClueIndex];
            const isFound = foundAnswers.includes(clue.id);
            const card = document.getElementById('current-clue-card');

            document.getElementById('c-hanzi').innerText = `${currentClueIndex + 1}. ${clue.hanzi}`;
            document.getElementById('c-pinyin').innerText = clue.pinyin;
            document.getElementById('c-meaning').innerText = clue.meaning;
            
            document.getElementById('progress-text').innerText = `${currentClueIndex + 1} / ${answers.length}`;

            if (isFound) {
                card.classList.add('found');
            } else {
                card.classList.remove('found');
            }
        }

        function prevClue() {
            if (currentClueIndex > 0) {
                currentClueIndex--;
                renderSingleClue();
            }
        }

        function nextClue() {
            if (currentClueIndex < answers.length - 1) {
                currentClueIndex++;
                renderSingleClue();
            }
        }

        function renderGrid() {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            for (let r = 0; r < 16; r++) {
                for (let c = 0; c < 16; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    cell.textContent = gridData[r][c];
                    cell.dataset.r = r;
                    cell.dataset.c = c;
                    cell.id = `cell-${r}-${c}`;

                    cell.addEventListener('mousedown', (e) => handleStart(r, c, e));
                    cell.addEventListener('mouseenter', (e) => handleMove(r, c, e));
                    
                    cell.addEventListener('touchstart', (e) => { e.preventDefault(); handleStart(r, c, e); }, {passive: false});
                    cell.addEventListener('touchmove', (e) => handleTouchMove(e), {passive: false});

                    grid.appendChild(cell);
                }
            }
        }

        function handleStart(r, c, e) {
            if (isCellFound(r, c)) return;
            
            if (!isSelecting) {
                isSelecting = true;
                isDragging = true;
                startR = r;
                startC = c;
                updateSelection(r, c);
            } else {
                updateSelection(r, c);
                evaluateSelection();
            }
        }

        function handleMove(r, c, e) {
            if (!isSelecting || !isDragging) return;
            if (isCellFound(r, c)) return;
            if (r !== startR && c !== startC) return; 
            updateSelection(r, c);
        }

        function handleTouchMove(e) {
            if (!isSelecting || !isDragging) return;
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            if (element && element.classList.contains('cell')) {
                const r = parseInt(element.dataset.r);
                const c = parseInt(element.dataset.c);
                if (r === startR || c === startC) {
                    updateSelection(r, c);
                }
            }
        }

        function updateSelection(endR, endC) {
            document.querySelectorAll('.cell.selecting').forEach(el => el.classList.remove('selecting'));
            currentSelection = [];

            const minR = Math.min(startR, endR);
            const maxR = Math.max(startR, endR);
            const minC = Math.min(startC, endC);
            const maxC = Math.max(startC, endC);

            for (let r = minR; r <= maxR; r++) {
                for (let c = minC; c <= maxC; c++) {
                    const cell = document.getElementById(`cell-${r}-${c}`);
                    if (cell && !cell.classList.contains('found')) {
                        cell.classList.add('selecting');
                        currentSelection.push({ r, c, char: gridData[r][c] });
                    }
                }
            }
        }

        function handleEnd() {
            if (!isSelecting) return;
            if (isDragging) {
                isDragging = false;
                if (currentSelection.length > 1) {
                    evaluateSelection();
                }
            }
        }

        function evaluateSelection() {
            if (currentSelection.length === 0) return;

            const selectedText = currentSelection.map(item => item.char).join('');
            const reversedText = selectedText.split('').reverse().join('');

            let matchIndex = answers.findIndex(ans => 
                !foundAnswers.includes(ans.id) && 
                (ans.text === selectedText || ans.text === reversedText)
            );

            if (matchIndex !== -1) {
                let match = answers[matchIndex];
                foundAnswers.push(match.id);
                
                currentSelection.forEach(item => {
                    const cell = document.getElementById(`cell-${item.r}-${item.c}`);
                    cell.classList.remove('selecting');
                    cell.classList.add('found');
                });

                confetti(confettiSettings);
                document.getElementById('grid-panel').classList.add('shake-effect');
                setTimeout(() => {
                    document.getElementById('grid-panel').classList.remove('shake-effect');
                }, 400);

                let nextUnsolvedIndex = answers.findIndex(ans => !foundAnswers.includes(ans.id));
                
                if (nextUnsolvedIndex !== -1) {
                    currentClueIndex = nextUnsolvedIndex;
                } else {
                    currentClueIndex = matchIndex; 
                    setTimeout(() => {
                        document.getElementById('win-overlay').style.display = 'flex';
                        let duration = 3 * 1000;
                        let end = Date.now() + duration;
                        (function frame() {
                            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#ff4757', '#2ed573'] });
                            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#1e90ff', '#ffa502'] });
                            if (Date.now() < end) requestAnimationFrame(frame);
                        }());
                    }, 500);
                }
                
                renderSingleClue();
            } else {
                currentSelection.forEach(item => {
                    const cell = document.getElementById(`cell-${item.r}-${item.c}`);
                    cell.classList.remove('selecting');
                });
            }
            
            currentSelection = [];
            isSelecting = false;
            isDragging = false;
        }

        function isCellFound(r, c) {
            return document.getElementById(`cell-${r}-${c}`).classList.contains('found');
        }

        function resetGame() {
            foundAnswers = [];
            currentClueIndex = 0;
            isSelecting = false;
            isDragging = false;
            currentSelection = [];
            
            answers = shuffleArray([...originalAnswers]);
            
            document.getElementById('win-overlay').style.display = 'none';
            renderSingleClue();
            document.querySelectorAll('.cell').forEach(cell => {
                cell.classList.remove('found', 'selecting');
            });
        }

        window.addEventListener('mouseup', handleEnd);
        window.addEventListener('touchend', handleEnd);

        init();
    </script>
</body>
</html>
